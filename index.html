
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental Clinic Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Bright Smile Dental Clinic</h1>
    <p class="subtitle">Patient Registration Form</p>

    <form>

        <h2>Patient Information</h2>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name"
        required>

        <div class="row">
            <div>
                <label>Date of Birth</label>
                <input type="date" required>
            </div>

            <div>
                <label>Gender</label>
                <select required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
        </div>

        <label>Phone Number</label>
        <input type="tel" placeholder="Enter phone number"
        pattern="[0-9]{10}" required>

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email"
        required>

        <label>Address</label>
        <textarea placeholder="Enter your address"
        required></textarea>

        <h2>Appointment Details</h2>

        <label>Appointment Date</label>
        <input type="date" required>

        <label>Preferred Time</label>
        <input type="time" required>

        <label>Dental Treatment</label>
        <select required>
            <option value="">Select Treatment</option>
            <option>Teeth Cleaning</option>
            <option>Tooth Extraction</option>
            <option>Root Canal</option>
            <option>Braces</option>
            <option>Teeth Whitening</option>
            <option>Dental Checkup</option>
        </select>

        <h2>Medical Information</h2>

        <label>Do you have any allergies?</label>
        <div class="radio">
            <label><input type="radio" name="allergy" required> Yes</label>
            <label><input type="radio" name="allergy"> No</label>
        </div>

        <label>Previous Dental Problems</label>
        <textarea placeholder="Describe your dental problems"></textarea>

        <label>Medical History</label>
        <textarea placeholder="Enter your medical history"></textarea>

        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset" class="reset">Reset</button>
        </div>

    </form>

    <p class="footer">Thank you for choosing Bright Smile Dental Clinic!</p>

</div>

</body>
</html>
